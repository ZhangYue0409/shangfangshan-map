<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>小山TTS测试</title>
</head>

<body>


<h2>小山语音测试</h2>


<button onclick="testTTS()">
测试小山声音
</button>


<pre id="result"></pre>



<script>


async function testTTS(){


    const result=document.getElementById("result");


    result.innerHTML="正在请求小山服务器...";


    try{


        const response = await fetch(
            "http://localhost:3000/tts",
            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },


                body:JSON.stringify({

                    text:"您好，我是上方山智慧伴游小山，很高兴为您服务。"

                })

            }
        );



        const data = await response.json();



        console.log("服务器返回:",data);



        result.innerHTML=
        JSON.stringify(data,null,2);



    }
    catch(error){


        console.error(error);


        result.innerHTML=
        "请求失败："+error;


    }


}



</script>


</body>
</html>
